<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  
  function getMermaidTheme() {
    const theme = document.documentElement.getAttribute('data-theme') || 'light';
    const isDark = theme === 'dark';
    
    if (isDark) {
      return {
        theme: 'dark',
        themeVariables: {
          primaryColor: '#f0a090',
          primaryTextColor: '#ebe5e7',
          primaryBorderColor: '#f0a090',
          lineColor: '#c5b5ba',
          secondaryColor: '#a0c8b0',
          tertiaryColor: '#b0b8e0',
          background: 'transparent',
          mainBkg: '#2a1f23',
          secondBkg: '#27191e',
          textColor: '#ebe5e7',
          border1: '#3d2f35',
          border2: '#4d3d45',
          fontFamily: 'inherit'
        }
      };
    } else {
      return {
        theme: 'base',
        themeVariables: {
          primaryColor: '#c75b4a',
          primaryTextColor: '#1a1a1a',
          primaryBorderColor: '#c75b4a',
          lineColor: '#4a524a',
          secondaryColor: '#6a9474',
          tertiaryColor: '#7282a8',
          background: 'transparent',
          mainBkg: '#d2d9cd',
          secondBkg: '#d0d8ca',
          textColor: '#1a1a1a',
          border1: '#c8d0c2',
          border2: '#b8c2b0',
          fontFamily: 'inherit'
        }
      };
    }
  }
  
  function initMermaid() {
    const config = getMermaidTheme();
    mermaid.initialize({ 
      startOnLoad: true, 
      theme: config.theme,
      themeVariables: config.themeVariables,
      securityLevel: 'loose'
    });
  }
  
  // Store original Mermaid code before rendering
  function storeMermaidCode() {
    document.querySelectorAll('.mermaid').forEach(function(el) {
      if (!el.dataset.originalCode) {
        el.dataset.originalCode = el.textContent.trim();
      }
    });
  }
  
  // Re-render Mermaid diagrams with new theme
  function rerenderMermaid() {
    const config = getMermaidTheme();
    mermaid.initialize({ 
      startOnLoad: false,
      theme: config.theme,
      themeVariables: config.themeVariables,
      securityLevel: 'loose'
    });
    
    // Re-render all mermaid diagrams
    document.querySelectorAll('.mermaid').forEach(function(el) {
      const originalCode = el.dataset.originalCode || el.textContent.trim();
      if (!originalCode) return;
      
      // Clear existing SVG
      el.innerHTML = originalCode;
      
      // Re-render
      const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
      mermaid.render(id, originalCode).then(function(result) {
        el.innerHTML = result.svg;
      }).catch(function(err) {
        console.error('Mermaid render error:', err);
      });
    });
  }
  
  // Store code before initial render
  document.addEventListener('DOMContentLoaded', function() {
    storeMermaidCode();
    initMermaid();
  });
  
  // If DOM is already loaded, store immediately
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', storeMermaidCode);
  } else {
    storeMermaidCode();
    initMermaid();
  }
  
  // Re-initialize on theme change
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
        // Small delay to ensure theme change is complete
        setTimeout(function() {
          rerenderMermaid();
        }, 100);
      }
    });
  });
  
  observer.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['data-theme']
  });
</script>
