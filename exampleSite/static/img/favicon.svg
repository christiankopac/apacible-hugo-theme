<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#34495e"/>
  <!-- Face circle -->
  <circle cx="50" cy="50" r="35" fill="#ecf0f1"/>
  <!-- Nose -->
  <circle cx="50" cy="45" r="4" fill="#2c3e50"/>
  <!-- Left eye -->
  <circle cx="40" cy="40" r="3" fill="#2c3e50"/>
  <!-- Right eye -->
  <circle cx="60" cy="40" r="3" fill="#2c3e50"/>
  <!-- Smile (arc) -->
  <path d="M 35 55 Q 50 65 65 55" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
</svg>
