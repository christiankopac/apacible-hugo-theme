{{ define "content" }}
<article class="post">
    <header>
        <h1>{{ .Title }}</h1>
        {{ with .Description }}
            <p class="post-description">{{ . }}</p>
        {{ end }}
    </header>

    <div class="password-protected-content">
        <!-- Password form (shown initially) -->
        <div id="password-form-container" class="password-form-container">
            <form id="password-form" class="password-form">
                <label for="password-input">Enter password to access this content:</label>
                <input 
                    type="password" 
                    id="password-input" 
                    name="password" 
                    autocomplete="off"
                    required
                    aria-label="Password"
                />
                <button type="submit" class="password-submit-btn">Submit</button>
                <div id="password-error" class="password-error" role="alert" aria-live="polite"></div>
            </form>
        </div>

        <!-- Protected content (hidden until password is correct) -->
        <div id="protected-content" class="protected-content" style="display: none;">
            {{ .Content }}
            
            {{ if .Params.pdf_path }}
                <div class="pdf-download-section">
                    <h2>Download PDF</h2>
                    <p>Click the button below to download the PDF file.</p>
                    <button 
                        type="button"
                        class="pdf-download-btn" 
                        id="pdf-download-link"
                        data-pdf-path="{{ .Params.pdf_path }}"
                        aria-label="Download PDF"
                    >
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download PDF
                    </button>
                    <div id="pdf-download-error" class="password-error" role="alert" aria-live="polite" style="display: none; margin-top: 1rem;"></div>
                </div>
            {{ end }}
        </div>
    </div>
</article>

<script>
(function() {
    // Password hash - this is a simple SHA-256 hash of the password
    // To generate a new hash, use: echo -n "yourpassword" | sha256sum
    // Or use an online SHA-256 generator
    const PASSWORD_HASH = '{{ .Params.password_hash | default "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" }}';
    const STORAGE_KEY = 'password_verified_{{ .File.ContentBaseName }}';
    
    const passwordForm = document.getElementById('password-form');
    const passwordInput = document.getElementById('password-input');
    const passwordError = document.getElementById('password-error');
    const passwordFormContainer = document.getElementById('password-form-container');
    const protectedContent = document.getElementById('protected-content');
    
    // Simple SHA-256 hash function (for client-side hashing)
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex;
    }
    
    // Check if already verified (from sessionStorage)
    function checkStoredVerification() {
        const stored = sessionStorage.getItem(STORAGE_KEY);
        if (stored === 'true') {
            showProtectedContent();
            return true;
        }
        return false;
    }
    
    // Show protected content
    function showProtectedContent() {
        passwordFormContainer.style.display = 'none';
        protectedContent.style.display = 'block';
        sessionStorage.setItem(STORAGE_KEY, 'true');
        // Store password hash for PDF download
        sessionStorage.setItem(STORAGE_KEY + '_hash', PASSWORD_HASH);
    }
    
    // Handle form submission
    async function handleSubmit(e) {
        e.preventDefault();
        
        const password = passwordInput.value;
        if (!password) {
            passwordError.textContent = 'Please enter a password.';
            passwordError.style.display = 'block';
            return;
        }
        
        // Hash the entered password
        const hash = await sha256(password);
        
        // Compare with stored hash
        if (hash.toLowerCase() === PASSWORD_HASH.toLowerCase()) {
            passwordError.style.display = 'none';
            showProtectedContent();
        } else {
            passwordError.textContent = 'Incorrect password. Please try again.';
            passwordError.style.display = 'block';
            passwordInput.value = '';
            passwordInput.focus();
        }
    }
    
    // Handle PDF download via Netlify Function
    const pdfDownloadLink = document.getElementById('pdf-download-link');
    const pdfDownloadError = document.getElementById('pdf-download-error');
    
    if (pdfDownloadLink) {
        pdfDownloadLink.addEventListener('click', async function(e) {
            e.preventDefault();
            
            const pdfPath = pdfDownloadLink.getAttribute('data-pdf-path');
            if (!pdfPath) {
                pdfDownloadError.textContent = 'PDF path not configured.';
                pdfDownloadError.style.display = 'block';
                return;
            }
            
            // Get stored password hash
            const storedHash = sessionStorage.getItem(STORAGE_KEY + '_hash') || PASSWORD_HASH;
            
            // Disable button during download
            pdfDownloadLink.disabled = true;
            pdfDownloadLink.textContent = 'Downloading...';
            pdfDownloadError.style.display = 'none';
            
            try {
                // Call Netlify Function to serve PDF
                const response = await fetch('/api/serve-pdf', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        password_hash: storedHash,
                        pdf_path: pdfPath,
                    }),
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: 'Unknown error' }));
                    throw new Error(errorData.error || `Server error: ${response.status}`);
                }
                
                // Get PDF as blob
                const blob = await response.blob();
                
                // Create download link and trigger download
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = pdfPath.split('/').pop() || 'document.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                // Reset button
                pdfDownloadLink.disabled = false;
                pdfDownloadLink.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download PDF
                `;
                
            } catch (error) {
                console.error('Error downloading PDF:', error);
                pdfDownloadError.textContent = error.message || 'Failed to download PDF. Please try again.';
                pdfDownloadError.style.display = 'block';
                
                // Reset button
                pdfDownloadLink.disabled = false;
                pdfDownloadLink.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download PDF
                `;
            }
        });
    }
    
    // Initialize
    if (!checkStoredVerification()) {
        passwordForm.addEventListener('submit', handleSubmit);
        passwordInput.focus();
    } else {
        // If already verified, ensure hash is stored
        if (!sessionStorage.getItem(STORAGE_KEY + '_hash')) {
            sessionStorage.setItem(STORAGE_KEY + '_hash', PASSWORD_HASH);
        }
    }
})();
</script>
{{ end }}
