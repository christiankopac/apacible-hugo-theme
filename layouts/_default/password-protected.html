{{ define "content" }}
<article class="post">
    <header>
        <h1>{{ .Title }}</h1>
        {{ with .Description }}
            <p class="post-description">{{ . }}</p>
        {{ end }}
    </header>

    <div class="password-protected-content">
        <!-- Password form (shown initially) -->
        <div id="password-form-container" class="password-form-container">
            <form id="password-form" class="password-form">
                <label for="password-input">Enter password to access this content:</label>
                <input 
                    type="password" 
                    id="password-input" 
                    name="password" 
                    autocomplete="off"
                    required
                    aria-label="Password"
                />
                <button type="submit" class="password-submit-btn">Submit</button>
                <div id="password-error" class="password-error" role="alert" aria-live="polite"></div>
            </form>
        </div>

        <!-- Protected content (hidden until password is correct) -->
        <div id="protected-content" class="protected-content" style="display: none;">
            {{ .Content }}
            
            {{ if .Params.pdf_path }}
                <div class="pdf-download-section">
                    <h2>Download PDF</h2>
                    <p>Click the button below to download the PDF file.</p>
                    <a href="{{ .Params.pdf_path | relURL }}" download class="pdf-download-btn" id="pdf-download-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download PDF
                    </a>
                </div>
            {{ end }}
        </div>
    </div>
</article>

<script>
(function() {
    // Password hash - this is a simple SHA-256 hash of the password
    // To generate a new hash, use: echo -n "yourpassword" | sha256sum
    // Or use an online SHA-256 generator
    const PASSWORD_HASH = '{{ .Params.password_hash | default "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" }}';
    const STORAGE_KEY = 'password_verified_{{ .File.ContentBaseName }}';
    
    const passwordForm = document.getElementById('password-form');
    const passwordInput = document.getElementById('password-input');
    const passwordError = document.getElementById('password-error');
    const passwordFormContainer = document.getElementById('password-form-container');
    const protectedContent = document.getElementById('protected-content');
    
    // Simple SHA-256 hash function (for client-side hashing)
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex;
    }
    
    // Check if already verified (from sessionStorage)
    function checkStoredVerification() {
        const stored = sessionStorage.getItem(STORAGE_KEY);
        if (stored === 'true') {
            showProtectedContent();
            return true;
        }
        return false;
    }
    
    // Show protected content
    function showProtectedContent() {
        passwordFormContainer.style.display = 'none';
        protectedContent.style.display = 'block';
        sessionStorage.setItem(STORAGE_KEY, 'true');
    }
    
    // Handle form submission
    async function handleSubmit(e) {
        e.preventDefault();
        
        const password = passwordInput.value;
        if (!password) {
            passwordError.textContent = 'Please enter a password.';
            passwordError.style.display = 'block';
            return;
        }
        
        // Hash the entered password
        const hash = await sha256(password);
        
        // Compare with stored hash
        if (hash.toLowerCase() === PASSWORD_HASH.toLowerCase()) {
            passwordError.style.display = 'none';
            showProtectedContent();
        } else {
            passwordError.textContent = 'Incorrect password. Please try again.';
            passwordError.style.display = 'block';
            passwordInput.value = '';
            passwordInput.focus();
        }
    }
    
    // Initialize
    if (!checkStoredVerification()) {
        passwordForm.addEventListener('submit', handleSubmit);
        passwordInput.focus();
    }
})();
</script>
{{ end }}
